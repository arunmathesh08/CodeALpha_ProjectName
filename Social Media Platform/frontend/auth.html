<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In / Register - ConnectHub</title>
  <meta name="description" content="Log in or create an account on ConnectHub to join vibrant discussions and communities." />

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body style="display:flex; flex-direction:column; min-height:100vh; justify-content:center; align-items:center; padding:1.5rem;">

  <div style="width:100%; max-width:480px;">
    <!-- Logo & Title -->
    <div style="text-align:center; margin-bottom:1.75rem;">
      <a href="/index.html" class="navbar-brand" style="justify-content:center; font-size:1.75rem; margin-bottom:0.4rem;">
        <div class="navbar-logo-icon" style="width:44px; height:44px; font-size:1.4rem;"><i class="bi bi-intersect"></i></div>
        Connect<span class="highlight">Hub</span>
      </a>
      <p style="color:var(--text-secondary); font-size:0.95rem;">Join discussions, discover communities, and share ideas.</p>
    </div>

    <div class="glass-card" style="padding:1.75rem; border-radius:var(--radius-xl);">
      <!-- Auth Switcher Header -->
      <div class="tabs-nav" style="margin-bottom:1.25rem;">
        <button class="tab-btn active" id="tab-auth-login" onclick="switchAuthTab('login')">
          <i class="bi bi-box-arrow-in-right"></i> Log In
        </button>
        <button class="tab-btn" id="tab-auth-register" onclick="switchAuthTab('register')">
          <i class="bi bi-person-plus"></i> Register
        </button>
      </div>

      <!-- Quick Demo Login Switcher -->
      <div style="background:var(--bg-input); padding:0.9rem; border-radius:var(--radius-md); margin-bottom:1.25rem; border:1px solid var(--border-color);">
        <div style="font-size:0.8rem; font-weight:700; color:var(--text-muted); margin-bottom:0.5rem; text-transform:uppercase;">
          ⚡ Instant Demo Login (1-Click)
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.4rem;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickDemoLogin('alex@connecthub.com')">
            Alex Kumar
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickDemoLogin('priya@connecthub.com')">
            Priya Sharma
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickDemoLogin('rahul@connecthub.com')">
            Rahul Dev
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickDemoLogin('sarah@connecthub.com')">
            Sarah Thomas
          </button>
        </div>
      </div>

      <!-- Login Form -->
      <div id="login-form-container">
        <form id="login-form">
          <div class="form-group">
            <label class="form-label">Email or Username</label>
            <input type="text" name="emailOrUsername" class="form-control" placeholder="alex@connecthub.com or alexkumar" required />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required />
          </div>
          <div style="display:flex; justify-content:flex-end; margin-bottom:1.1rem;">
            <a href="#" onclick="switchAuthTab('forgot'); return false;" style="font-size:0.85rem; color:var(--accent-primary);">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
        </form>
      </div>

      <!-- Register Form -->
      <div id="register-form-container" style="display:none;">
        <form id="register-form">
          <div class="form-group">
            <label class="form-label">Full Name *</label>
            <input type="text" name="fullName" class="form-control" placeholder="e.g. Maya Lin" required />
          </div>
          <div class="form-group">
            <label class="form-label">Username *</label>
            <input type="text" name="username" class="form-control" placeholder="e.g. mayalin" required />
          </div>
          <div class="form-group">
            <label class="form-label">Email Address *</label>
            <input type="email" name="email" class="form-control" placeholder="maya@example.com" required />
          </div>
          <div class="form-group">
            <label class="form-label">Password *</label>
            <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required />
          </div>
          <div class="form-group">
            <label class="form-label">Bio (Optional)</label>
            <input type="text" name="bio" class="form-control" placeholder="A short description about yourself" />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Create Account</button>
        </form>
      </div>

      <!-- Forgot Password Form -->
      <div id="forgot-form-container" style="display:none;">
        <form id="forgot-form">
          <p style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:1rem;">
            Enter your email address to receive simulated password reset instructions.
          </p>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="your@email.com" required />
          </div>
          <div style="display:flex; gap:0.5rem; margin-top:1.25rem;">
            <button type="button" class="btn btn-secondary" onclick="switchAuthTab('login')">Back to Login</button>
            <button type="submit" class="btn btn-primary" style="flex:1;">Send Reset Link</button>
          </div>
        </form>
      </div>
    </div>

    <div style="text-align:center; margin-top:1.25rem; font-size:0.85rem; color:var(--text-muted);">
      <a href="/index.html" style="color:var(--text-secondary);"><i class="bi bi-arrow-left"></i> Return to Home Feed</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
