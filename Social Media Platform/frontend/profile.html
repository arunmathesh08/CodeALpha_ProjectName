<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile - ConnectHub</title>
  <meta name="description" content="User profile on ConnectHub - View posts, comments, likes, saved bookmarks, and followers." />

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>

  <!-- Top Sticky Navigation Bar -->
  <header class="navbar">
    <a href="/index.html" class="navbar-brand">
      <div class="navbar-logo-icon"><i class="bi bi-intersect"></i></div>
      Connect<span class="highlight">Hub</span>
    </a>

    <!-- Global Search -->
    <div class="nav-search-container">
      <i class="bi bi-search nav-search-icon"></i>
      <input type="text" class="nav-search-input" id="nav-search-input" placeholder="Search ConnectHub..." autocomplete="off" />
      <div class="search-results-dropdown" id="nav-search-dropdown"></div>
    </div>

    <!-- Actions -->
    <div class="navbar-actions">
      <button class="nav-icon-btn theme-toggle-btn" title="Toggle Light/Dark Theme">
        <i class="bi bi-sun-fill"></i>
      </button>
      <a href="/notifications.html" class="nav-icon-btn auth-user-only" title="Notifications" style="text-decoration:none;">
        <i class="bi bi-bell"></i>
        <span class="nav-badge-count notification-unread-badge" style="display:none;">0</span>
      </a>
      <div class="auth-guest-only">
        <button class="btn btn-secondary btn-sm" onclick="openAuthModal('login')">
          <i class="bi bi-box-arrow-in-right"></i> Log In
        </button>
      </div>
      <div class="nav-user-menu auth-user-only" style="display:none;">
        <button class="nav-user-btn" id="nav-user-menu-btn">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=user" alt="User" class="avatar-img current-user-avatar" />
          <i class="bi bi-chevron-down" style="font-size:0.75rem; color:var(--text-muted);"></i>
        </button>
        <div class="nav-dropdown" id="nav-user-dropdown">
          <div style="padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border-color); margin-bottom: 0.25rem;">
            <div class="current-user-fullname" style="font-weight:700; font-size:0.95rem;">User</div>
            <div class="current-user-username" style="font-size:0.8rem; color:var(--text-muted);">@username</div>
          </div>
          <a href="/profile.html" class="dropdown-item current-user-profile-link">
            <i class="bi bi-person"></i> My Profile
          </a>
          <a href="/profile.html?tab=saved" class="dropdown-item">
            <i class="bi bi-bookmark"></i> Saved Posts
          </a>
          <div class="dropdown-divider"></div>
          <a href="#" class="dropdown-item logout-btn" style="color:#ef4444;">
            <i class="bi bi-box-arrow-right"></i> Log Out
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- 3-Column Layout Container -->
  <main class="app-container">
    <!-- Left Navigation Sidebar -->
    <aside class="left-sidebar">
      <nav class="nav-menu-list">
        <a href="/index.html" class="nav-menu-item">
          <i class="bi bi-house-door-fill"></i> Home Feed
        </a>
        <a href="/search.html" class="nav-menu-item">
          <i class="bi bi-compass-fill"></i> Explore Communities
        </a>
        <a href="/notifications.html" class="nav-menu-item auth-user-only">
          <i class="bi bi-bell-fill"></i> Notifications
        </a>
        <a href="/profile.html" class="nav-menu-item active current-user-profile-link auth-user-only">
          <i class="bi bi-person-circle"></i> My Profile
        </a>
      </nav>
    </aside>

    <!-- Center Profile Content -->
    <section class="main-content">
      <!-- Profile Header Container -->
      <div id="profile-header-container">
        <div class="glass-card skeleton" style="height: 280px;"></div>
      </div>

      <!-- Profile Tabs -->
      <nav class="tabs-nav">
        <button class="tab-btn profile-tab-btn active" data-tab="posts">
          <i class="bi bi-grid"></i> Posts
        </button>
        <button class="tab-btn profile-tab-btn" data-tab="comments">
          <i class="bi bi-chat-dots"></i> Comments
        </button>
        <button class="tab-btn profile-tab-btn" data-tab="liked">
          <i class="bi bi-heart"></i> Liked Posts
        </button>
        <button class="tab-btn profile-tab-btn auth-user-only" data-tab="saved">
          <i class="bi bi-bookmark"></i> Saved Posts
        </button>
      </nav>

      <!-- Profile Tab Content Stream -->
      <div id="profile-tab-content" style="display:flex; flex-direction:column; gap:1.25rem;">
        <div class="glass-card skeleton" style="height: 180px;"></div>
      </div>
    </section>

    <!-- Right Sidebar Widgets -->
    <aside class="right-sidebar">
      <div class="glass-card widget-card">
        <div class="widget-title">
          <span><i class="bi bi-person-plus-fill" style="color:var(--accent-primary);margin-right:0.4rem;"></i> Suggested People</span>
        </div>
        <div id="suggested-users-widget">
          <div class="skeleton" style="height:45px;margin-bottom:0.4rem;"></div>
          <div class="skeleton" style="height:45px;"></div>
        </div>
      </div>
    </aside>
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav">
    <a href="/index.html" class="mobile-nav-item">
      <i class="bi bi-house-door"></i>
      <span>Feed</span>
    </a>
    <a href="/search.html" class="mobile-nav-item">
      <i class="bi bi-compass"></i>
      <span>Explore</span>
    </a>
    <a href="/notifications.html" class="mobile-nav-item">
      <i class="bi bi-bell"></i>
      <span>Alerts</span>
    </a>
    <a href="/profile.html" class="mobile-nav-item active current-user-profile-link">
      <i class="bi bi-person-fill"></i>
      <span>Profile</span>
    </a>
  </nav>

  <!-- =========================================================
       MODALS
       ========================================================= -->

  <!-- Edit Profile Modal -->
  <div class="modal-overlay" id="edit-profile-modal">
    <div class="modal-content" style="max-width: 520px;">
      <div class="modal-header">
        <h3 class="modal-title">Edit Profile</h3>
        <button class="modal-close"><i class="bi bi-x"></i></button>
      </div>
      <div class="modal-body">
        <form id="edit-profile-form">
          <div class="form-group">
            <label class="form-label">Full Name *</label>
            <input type="text" class="form-control" id="edit-fullname-input" required maxlength="50" />
          </div>
          <div class="form-group">
            <label class="form-label">Bio</label>
            <textarea class="form-control" id="edit-bio-input" maxlength="300" placeholder="Tell everyone about yourself..."></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" id="edit-location-input" placeholder="e.g. San Francisco, CA" maxlength="100" />
          </div>
          <div class="form-group">
            <label class="form-label">Avatar Image URL</label>
            <input type="url" class="form-control" id="edit-avatar-input" placeholder="https://..." />
          </div>
          <div class="form-group">
            <label class="form-label">Cover Banner URL</label>
            <input type="url" class="form-control" id="edit-cover-input" placeholder="https://..." />
          </div>
          <div class="modal-footer" style="padding:0; padding-top:1rem;">
            <button type="button" class="btn btn-secondary btn-close-modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Followers / Following List Modal -->
  <div class="modal-overlay" id="follow-list-modal">
    <div class="modal-content" style="max-width: 440px;">
      <div class="modal-header">
        <h3 class="modal-title" id="follow-modal-title">Followers</h3>
        <button class="modal-close" onclick="document.getElementById('follow-list-modal').classList.remove('active')"><i class="bi bi-x"></i></button>
      </div>
      <div class="modal-body" id="follow-modal-list" style="display:flex; flex-direction:column; gap:0.75rem; max-height:400px; overflow-y:auto;">
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
