<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications - ConnectHub</title>
  <meta name="description" content="Stay updated with your latest comments, likes, replies, and followers on ConnectHub." />

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <a href="/index.html" class="navbar-brand">
      <div class="navbar-logo-icon"><i class="bi bi-intersect"></i></div>
      Connect<span class="highlight">Hub</span>
    </a>

    <div class="navbar-actions">
      <button class="nav-icon-btn theme-toggle-btn" title="Toggle Light/Dark Theme">
        <i class="bi bi-sun-fill"></i>
      </button>
      <div class="auth-guest-only">
        <button class="btn btn-secondary btn-sm" onclick="openAuthModal('login')">
          <i class="bi bi-box-arrow-in-right"></i> Log In
        </button>
      </div>
      <div class="nav-user-menu auth-user-only" style="display:none;">
        <button class="nav-user-btn" id="nav-user-menu-btn">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=user" alt="User" class="avatar-img current-user-avatar" />
          <i class="bi bi-chevron-down" style="font-size:0.75rem; color:var(--text-muted);"></i>
        </button>
        <div class="nav-dropdown" id="nav-user-dropdown">
          <a href="/profile.html" class="dropdown-item current-user-profile-link">
            <i class="bi bi-person"></i> My Profile
          </a>
          <div class="dropdown-divider"></div>
          <a href="#" class="dropdown-item logout-btn" style="color:#ef4444;">
            <i class="bi bi-box-arrow-right"></i> Log Out
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- 3-Column Layout Container -->
  <main class="app-container">
    <aside class="left-sidebar">
      <nav class="nav-menu-list">
        <a href="/index.html" class="nav-menu-item">
          <i class="bi bi-house-door-fill"></i> Home Feed
        </a>
        <a href="/search.html" class="nav-menu-item">
          <i class="bi bi-compass-fill"></i> Explore Communities
        </a>
        <a href="/notifications.html" class="nav-menu-item active auth-user-only">
          <i class="bi bi-bell-fill"></i> Notifications
        </a>
        <a href="/profile.html" class="nav-menu-item current-user-profile-link auth-user-only">
          <i class="bi bi-person-circle"></i> My Profile
        </a>
      </nav>
    </aside>

    <section class="main-content">
      <!-- Page Header with Mark All as Read -->
      <div class="glass-card" style="padding: 1.25rem 1.5rem; display:flex; align-items:center; justify-content:space-between;">
        <h1 style="font-size:1.35rem; font-weight:700;">Notifications</h1>
        <button class="btn btn-secondary btn-sm" id="mark-all-read-btn">
          <i class="bi bi-check2-all"></i> Mark all as read
        </button>
      </div>

      <!-- Filter Tabs -->
      <nav class="tabs-nav">
        <button class="tab-btn notification-tab-btn active" data-filter="all">
          <i class="bi bi-bell-fill"></i> All
        </button>
        <button class="tab-btn notification-tab-btn" data-filter="unread">
          <i class="bi bi-envelope-open-fill"></i> Unread
        </button>
        <button class="tab-btn notification-tab-btn" data-filter="likes">
          <i class="bi bi-heart-fill"></i> Likes & Votes
        </button>
        <button class="tab-btn notification-tab-btn" data-filter="comments">
          <i class="bi bi-chat-text-fill"></i> Comments & Replies
        </button>
        <button class="tab-btn notification-tab-btn" data-filter="follows">
          <i class="bi bi-person-plus-fill"></i> Follows
        </button>
      </nav>

      <!-- Notifications List -->
      <div id="notifications-list-container">
        <div class="glass-card skeleton" style="height: 90px; margin-bottom: 0.75rem;"></div>
        <div class="glass-card skeleton" style="height: 90px;"></div>
      </div>
    </section>

    <aside class="right-sidebar">
      <div class="glass-card widget-card">
        <div class="widget-title">
          <span><i class="bi bi-info-circle-fill" style="color:var(--accent-primary);margin-right:0.4rem;"></i> Preferences</span>
        </div>
        <div style="font-size:0.85rem; color:var(--text-secondary); line-height:1.5;">
          You receive notifications in real-time for likes, upvotes, replies to your comments, and when new members follow you.
        </div>
      </div>
    </aside>
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav">
    <a href="/index.html" class="mobile-nav-item">
      <i class="bi bi-house-door"></i>
      <span>Feed</span>
    </a>
    <a href="/search.html" class="mobile-nav-item">
      <i class="bi bi-compass"></i>
      <span>Explore</span>
    </a>
    <a href="/notifications.html" class="mobile-nav-item active">
      <i class="bi bi-bell-fill"></i>
      <span>Alerts</span>
    </a>
    <a href="/profile.html" class="mobile-nav-item current-user-profile-link">
      <i class="bi bi-person"></i>
      <span>Profile</span>
    </a>
  </nav>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
</body>
</html>
