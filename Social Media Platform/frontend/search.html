<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search & Explore - ConnectHub</title>
  <meta name="description" content="Discover communities, users, and discussions across ConnectHub." />

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <a href="/index.html" class="navbar-brand">
      <div class="navbar-logo-icon"><i class="bi bi-intersect"></i></div>
      Connect<span class="highlight">Hub</span>
    </a>

    <div class="navbar-actions">
      <button class="nav-icon-btn theme-toggle-btn" title="Toggle Light/Dark Theme">
        <i class="bi bi-sun-fill"></i>
      </button>
      <a href="/notifications.html" class="nav-icon-btn auth-user-only" title="Notifications" style="text-decoration:none;">
        <i class="bi bi-bell"></i>
        <span class="nav-badge-count notification-unread-badge" style="display:none;">0</span>
      </a>
      <div class="auth-guest-only">
        <button class="btn btn-secondary btn-sm" onclick="openAuthModal('login')">
          <i class="bi bi-box-arrow-in-right"></i> Log In
        </button>
      </div>
      <div class="nav-user-menu auth-user-only" style="display:none;">
        <button class="nav-user-btn" id="nav-user-menu-btn">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=user" alt="User" class="avatar-img current-user-avatar" />
          <i class="bi bi-chevron-down" style="font-size:0.75rem; color:var(--text-muted);"></i>
        </button>
        <div class="nav-dropdown" id="nav-user-dropdown">
          <a href="/profile.html" class="dropdown-item current-user-profile-link">
            <i class="bi bi-person"></i> My Profile
          </a>
          <div class="dropdown-divider"></div>
          <a href="#" class="dropdown-item logout-btn" style="color:#ef4444;">
            <i class="bi bi-box-arrow-right"></i> Log Out
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- 3-Column Layout Container -->
  <main class="app-container">
    <aside class="left-sidebar">
      <nav class="nav-menu-list">
        <a href="/index.html" class="nav-menu-item">
          <i class="bi bi-house-door-fill"></i> Home Feed
        </a>
        <a href="/search.html" class="nav-menu-item active">
          <i class="bi bi-compass-fill"></i> Explore & Search
        </a>
        <a href="/notifications.html" class="nav-menu-item auth-user-only">
          <i class="bi bi-bell-fill"></i> Notifications
        </a>
        <a href="/profile.html" class="nav-menu-item current-user-profile-link auth-user-only">
          <i class="bi bi-person-circle"></i> My Profile
        </a>
      </nav>
    </aside>

    <section class="main-content">
      <!-- Search Input Card -->
      <div class="glass-card" style="padding: 1.25rem;">
        <div style="display:flex; gap:0.75rem;">
          <input type="text" class="form-control" id="search-page-input" placeholder="Search keywords, topics, usernames..." style="font-size:1rem; padding:0.75rem 1.1rem;" />
          <button class="btn btn-primary" id="search-page-btn" style="padding:0 1.5rem;">
            <i class="bi bi-search"></i> Search
          </button>
        </div>
      </div>

      <!-- Search Category Tabs -->
      <nav class="tabs-nav">
        <button class="tab-btn search-tab-btn active" data-tab="all">
          <i class="bi bi-grid-fill"></i> All Results
        </button>
        <button class="tab-btn search-tab-btn" data-tab="communities">
          <i class="bi bi-collection-fill"></i> Communities
        </button>
        <button class="tab-btn search-tab-btn" data-tab="users">
          <i class="bi bi-people-fill"></i> People
        </button>
        <button class="tab-btn search-tab-btn" data-tab="posts">
          <i class="bi bi-chat-square-text-fill"></i> Posts
        </button>
      </nav>

      <!-- Search / Explore Results -->
      <div id="search-results-container">
        <div class="glass-card skeleton" style="height: 200px;"></div>
      </div>
    </section>

    <aside class="right-sidebar">
      <div class="glass-card widget-card">
        <div class="widget-title">
          <span><i class="bi bi-lightbulb-fill" style="color:#f59e0b;margin-right:0.4rem;"></i> Search Tips</span>
        </div>
        <div style="font-size:0.85rem; color:var(--text-secondary); line-height:1.6;">
          • Search <strong>Technology</strong> or <strong>AI</strong> to find groups.<br />
          • Search <strong>@alexkumar</strong> to view profiles.<br />
          • Search <strong>#JavaScript</strong> for tagged discussions.
        </div>
      </div>
    </aside>
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav">
    <a href="/index.html" class="mobile-nav-item">
      <i class="bi bi-house-door"></i>
      <span>Feed</span>
    </a>
    <a href="/search.html" class="mobile-nav-item active">
      <i class="bi bi-compass-fill"></i>
      <span>Explore</span>
    </a>
    <a href="/notifications.html" class="mobile-nav-item">
      <i class="bi bi-bell"></i>
      <span>Alerts</span>
    </a>
    <a href="/profile.html" class="mobile-nav-item current-user-profile-link">
      <i class="bi bi-person"></i>
      <span>Profile</span>
    </a>
  </nav>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/search.js"></script>
</body>
</html>
